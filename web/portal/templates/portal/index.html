<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Serralheria Casa das Artes | Sistema de Gestão</title>
  <style>
    :root {
      --verde: #468b59;
      --verde-escuro: #2c7042;
      --verde-claro: #e8f3eb;
      --grafite: #303a3f;
      --grafite-escuro: #242c30;
      --fundo: #f5f7f6;
      --branco: #ffffff;
      --texto: #233138;
      --suave: #738189;
      --borda: #e0e8e3;
      --laranja: #a86a17;
      --vermelho: #ae443d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 'Segoe UI', Arial, sans-serif; background: var(--fundo); color: var(--texto); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
    .app { display: flex; min-height: 100vh; }
    .lateral { width: 246px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 25px 14px; background: linear-gradient(165deg,var(--grafite),var(--grafite-escuro)); color: #fff; }
    .marca { padding: 0 9px 23px; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid #52605a; margin-bottom: 20px; }
    .marca-simbolo { font-size: 31px; color: #9ad2a7; }
    .marca strong { display: block; line-height: 1.2; font-size: 16px; }
    .marca strong span { display: block; color: #9ad2a7; }
    .marca small { color: #c5cec9; font-size: 10px; text-transform: uppercase; letter-spacing: .8px; }
    .nav-titulo { margin: 0 13px 10px; color: #abbab1; font-size: 10px; letter-spacing: 1.3px; }
    .navegacao { display: grid; gap: 4px; }
    .nav-btn { width: 100%; border: 0; background: transparent; color: #e5ebe7; text-align: left; border-radius: 9px; padding: 10px 11px; display: flex; align-items: center; gap: 11px; }
    .nav-btn:hover { background: #46534e; }
    .nav-btn.ativo { background: var(--verde); color: white; font-weight: 700; }
    .nav-btn .ico { width: 24px; text-align: center; font-size: 17px; }
    .menu-rodape { color: #bdc9c1; font-size: 12px; border-top: 1px solid #52605a; margin: 30px 9px 0; padding-top: 16px; }
    .principal { flex: 1; min-width: 0; }
    .topo { min-height: 74px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 32px; background: var(--branco); border-bottom: 1px solid var(--borda); }
    .busca-global { background: #f8faf9; border: 1px solid var(--borda); padding: 9px 12px; border-radius: 9px; width: 380px; max-width: 58%; color: var(--suave); }
    .perfil { display: flex; align-items: center; gap: 11px; }
    .avatar { background: #d8ebdd; color: var(--verde-escuro); border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; font-weight: 800; }
    .perfil small { display: block; color: var(--suave); }
    .conteudo { padding: 29px 33px 45px; max-width: 1650px; margin: auto; }
    h1 { font-size: 28px; margin: 0 0 5px; letter-spacing: -.4px; }
    h2 { font-size: 17px; margin: 0; }
    h3 { font-size: 14px; margin: 0; }
    p { margin: 0; }
    .suave { color: var(--suave); }
    .cabecalho { display: flex; justify-content: space-between; align-items: start; gap: 18px; margin-bottom: 22px; }
    .card { background: #fff; border: 1px solid var(--borda); border-radius: 13px; box-shadow: 0 4px 16px rgba(15,40,22,.045); }
    .card-pad { padding: 21px; }
    .card-titulo { display: flex; gap: 9px; align-items: center; margin-bottom: 17px; }
    .card-titulo .sinal { color: var(--verde-escuro); font-size: 19px; }
    .botao { background: var(--verde); color: #fff; border: 1px solid var(--verde); padding: 10px 15px; border-radius: 9px; font-weight: 650; }
    .botao:hover { background: var(--verde-escuro); }
    .botao-outline { color: var(--verde-escuro); background: #fff; border: 1px solid #a9cbb1; }
    .botao-outline:hover { background: var(--verde-claro); }
    .botao-pequeno { padding: 6px 11px; font-size: 12px; }
    .link { border: 0; background: transparent; color: var(--verde-escuro); font-weight: 700; padding: 3px 0; }
    .link:hover { text-decoration: underline; }
    .chip { border-radius: 50px; display: inline-block; padding: 4px 9px; font-size: 11px; font-weight: 700; }
    .chip-verde { background: #e5f5e8; color: #287648; }
    .chip-laranja { background: #fff1dc; color: #966318; }
    .chip-vermelho { background: #fae9e7; color: #a6423d; }
    .notinha { font-size: 11px; color: var(--suave); margin-top: 17px; }
    /* HOME */
    .alerta { padding: 16px 20px; margin-bottom: 18px; border: 1px solid #c8dfcc; border-left: 5px solid var(--verde); border-radius: 12px; background: #f0f8f2; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .alerta strong { font-size: 16px; display: block; }
    .home-grid { display: grid; grid-template-columns: 1.22fr 1fr; gap: 20px; align-items: start; }
    .atalhos { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 11px; }
    .atalho { display: flex; gap: 10px; align-items: center; border-radius: 10px; border: 1px solid var(--borda); background: #fff; padding: 12px 10px; min-height: 66px; text-align: left; font-size: 12px; font-weight: 700; }
    .atalho:hover { border-color: #95c9a0; background: #f5faf6; transform: translateY(-1px); }
    .atalho .sinal { display: grid; place-items: center; background: var(--verde-claro); color: var(--verde-escuro); font-size: 21px; width: 39px; height: 39px; flex-shrink: 0; border-radius: 9px; }
    .atalho .seta { margin-left: auto; color: #9ba9a0; }
    .financeiro-topo { background: #f0f7f2; padding: 17px 20px; border-radius: 13px 13px 0 0; border-bottom: 1px solid var(--borda); }
    .periodo { padding: 15px 0; border-bottom: 1px solid var(--borda); }
    .periodo:last-of-type { border-bottom: none; }
    .periodo strong.titulo { display: block; color: var(--verde-escuro); margin-bottom: 11px; }
    .linha { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; gap: 12px; }
    .linha span { color: var(--suave); }
    .linha b { text-align: right; }
    .linha.lucro { background: var(--verde-claro); border-radius: 8px; padding: 10px; margin-top: 6px; }
    .linha.lucro b { color: var(--verde-escuro); }
    .meta { padding: 15px; border: 1px solid #d5e8d8; background: #eff7f1; border-radius: 10px; margin-top: 10px; }
    .progresso { height: 11px; background: #d8e9db; border-radius: 20px; margin: 10px 0 4px; overflow: hidden; }
    .progresso > div { background: var(--verde); height: 100%; }
    .mini-indicadores { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 0 0 20px; }
    .mini-indicador { padding: 16px; }
    .mini-indicador small { display: block; color: var(--suave); margin-bottom: 5px; }
    .mini-indicador b { font-size: 25px; }
    .mini-indicador.alerta-cor b { color: var(--laranja); }
    .mini-indicador.urgente b { color: var(--vermelho); }
    /* TABELAS E FORMULÁRIOS */
    .tabela-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th { background: #f6f9f7; color: #697a71; font-weight: 700; text-align: left; white-space: nowrap; }
    th,td { padding: 12px; border-bottom: 1px solid #e8eeea; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafcfb; }
    .filtro { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .campo-input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cfdbd3; background: #fff; color: var(--texto); }
    .filtro .campo-input { width: min(400px,100%); }
    .filtro select { width: auto; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .form-grid label { font-size: 12px; font-weight: 700; color: #52665a; }
    .form-grid input, .form-grid select { margin-top: 5px; }
    .form-grid .linha-inteira { grid-column: 1/-1; }
    .sem-resultado { color: var(--suave); text-align: center; padding: 25px !important; }
    /* FICHA CLIENTE */
    .cliente-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 21px; margin-bottom: 18px; }
    .cliente-pessoa { display: flex; align-items: center; gap: 14px; }
    .cliente-circulo { width: 57px; height: 57px; flex-shrink: 0; background: #d8ebdd; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 800; color: var(--verde-escuro); }
    .abas { display: flex; gap: 7px; border-bottom: 1px solid var(--borda); margin-bottom: 20px; }
    .aba { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--suave); font-weight: 700; padding: 13px 20px; }
    .aba.ativa { border-bottom-color: var(--verde); color: var(--verde-escuro); }
    .duas-colunas { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 17px; }
    .info { display: flex; justify-content: space-between; gap: 15px; border-bottom: 1px solid #edf2ee; padding: 12px 0; }
    .info:last-child { border: none; }
    .info span { color: var(--suave); }
    .info strong { text-align: right; }
    .nota { background: #f6f9f7; border: 1px solid var(--borda); border-radius: 8px; padding: 14px; }
    @media(max-width:1200px) { .home-grid { grid-template-columns: 1fr; } .atalhos { grid-template-columns: repeat(4,minmax(0,1fr)); } }
    @media(max-width:900px) { .lateral { width: 72px; padding: 20px 8px; } .marca { justify-content: center; padding: 0 0 20px; } .marca-simbolo { font-size: 24px; } .marca .texto, .nav-btn .nome, .nav-titulo, .menu-rodape { display: none; } .nav-btn { justify-content: center; } .conteudo { padding: 22px; } .atalhos { grid-template-columns: repeat(3,minmax(0,1fr)); } }
    @media(max-width:680px) { .topo { padding: 12px; } .busca-global { width: 56%; } .conteudo { padding: 17px 12px; } .atalhos, .mini-indicadores, .duas-colunas, .form-grid { grid-template-columns: 1fr; } .alerta, .cabecalho, .cliente-topo { align-items: flex-start; flex-direction: column; } .aba { padding: 10px 8px; } .form-grid .linha-inteira { grid-column: auto; } }
    /* ================= AGENDA SEMANAL E ROTAS ================= */
    .agenda-toolbar { display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:0 0 18px; }
    .agenda-controles { display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
    .agenda-controles button { min-width:38px; }
    .agenda-periodo { min-width:220px;text-align:center;font-weight:750;font-size:15px; }
    .agenda-legenda {display:flex;gap:15px;flex-wrap:wrap;color:var(--suave);font-size:12px;margin-bottom:16px;}
    .legenda-bola {display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
    .agenda-painel { padding:20px; margin:0 0 20px; }
    .agenda-scroller {width:100%;overflow-x:auto;}
    .agenda-calendario {display:grid;grid-template-columns:74px repeat(7,minmax(135px,1fr));gap:1px;background:var(--borda);border:1px solid var(--borda);border-radius:11px;overflow:hidden;min-width:1040px;}
    .agenda-hora,.agenda-cab-dia,.agenda-celula { background:#fff; }
    .agenda-hora {display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:12px;font-weight:650;}
    .agenda-cab-dia {border:0;background:#f6faf7;padding:14px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;color:var(--texto);}
    .agenda-cab-dia strong {font-size:17px;}
    .agenda-cab-dia small {color:var(--suave);}
    .agenda-cab-dia.selecionado {background:#d9ebde;box-shadow:inset 0 3px var(--verde);color:var(--verde-escuro);}
    .agenda-cab-dia.hoje {outline:2px solid #a6cdb0;outline-offset:-2px;}
    .agenda-celula {border:0;padding:5px;min-height:64px;text-align:left;cursor:pointer;transition:background .15s;}
    .agenda-celula:hover:not(:disabled){background:#eff7f0;}
    .agenda-celula.selecionado {background:#f1f8f2;}
    .agenda-celula.bloqueado {background:#f1f3f2;cursor:default;color:#abb5ae;}
    .agenda-celula.ocupado {background:#ecf5ee;}
    .agenda-celula.passado {opacity:.68;}
    .agenda-tag {display:block;border-radius:7px;padding:7px;font-size:11px;line-height:1.35;background:#d1e8d7;color:#225d34;overflow-wrap:anywhere;}
    .agenda-tag b {display:block;margin-bottom:3px;}
    .agenda-vago {display:inline-block;font-size:11px;color:#8ba198;padding:8px;}
    .agenda-fechado {display:inline-block;font-size:11px;color:#b0b9b2;padding:8px;}
    .ag-section {margin-top:20px;}
    .agenda-chamada {background:#f4faf6;border:1px solid #cfe4d4;border-radius:10px;padding:13px 15px;color:#42614b;font-size:12px;margin-bottom:16px;line-height:1.55;}
    .ag-form {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:12px;}
    .ag-form label,.manual-form label {color:#496052;font-size:12px;font-weight:700;display:block;}
    .ag-form input,.ag-form select,.manual-form input,.manual-form select {margin-top:6px;}
    .ag-full {grid-column:1/-1;}
    .ag-submit {margin-top:15px;display:flex;justify-content:flex-end;gap:10px;}
    .ag-sugestoes {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px;}
    .ag-opcao {border:1px solid #c8e0ce;background:#f8fcf9;border-radius:12px;padding:17px 13px;display:flex;flex-direction:column;gap:5px;}
    .ag-opcao .turno {color:var(--verde-escuro);font-size:11px;font-weight:750;letter-spacing:.4px;text-transform:uppercase;}
    .ag-opcao .data {font-size:15px;font-weight:850;}
    .ag-opcao .horario {font-size:25px;font-weight:800;color:var(--verde-escuro);}
    .ag-opcao .info-menor {font-size:11px;color:var(--suave);min-height:35px;}
    .ag-opcao button {margin-top:auto;}
    .ag-manual {background:#f7f9f8;border:1px dashed #b7cdbd;border-radius:11px;padding:17px;margin-top:15px;}
    .manual-form {display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;}
    .ag-atencao {display:block;color:var(--laranja);margin-top:9px;font-size:12px;}
    .ag-layout-rota {display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:18px;margin-top:15px;}
    .ag-mapa {position:relative;min-height:300px;border:1px solid #dce8e1;background:linear-gradient(135deg,#f3f9f6,#e9f2ed);border-radius:11px;overflow:hidden;}
    .ag-mapa svg {display:block;width:100%;height:310px;}
    .ag-mapa-rodape {position:absolute;bottom:8px;left:10px;font-size:10px;color:#748b7b;background:#ffffffdf;padding:5px 7px;border-radius:5px;}
    .ag-resumo-rota {display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 15px;}
    .ag-resumo-rota div {background:#f4f8f5;border:1px solid #e4ebe6;border-radius:9px;padding:10px;}
    .ag-resumo-rota span {display:block;font-size:11px;color:var(--suave);}
    .ag-resumo-rota strong {font-size:19px;color:var(--verde-escuro);}
    .ag-rota-item {display:flex;gap:11px;margin-bottom:16px;align-items:flex-start;}
    .ag-passo {width:32px;height:32px;flex-shrink:0;border-radius:50%;background:#dceee1;color:var(--verde-escuro);font-weight:800;display:grid;place-items:center;}
    .ag-rota-item p {color:var(--suave);font-size:12px;margin-top:2px;}
    .ag-vazio {padding:35px 12px;text-align:center;color:var(--suave);}
    .ag-rota-avisos {font-size:12px;background:#fff4e3;color:#8a5a19;border:1px solid #f3ddbd;border-radius:8px;padding:11px;margin:15px 0;}
    .ag-cinza {color:var(--suave);font-size:12px;}
    .ag-inline {display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .ag-data {font-size:13px;font-weight:800;color:var(--verde-escuro);}
    @media(max-width:1400px){.ag-sugestoes {grid-template-columns:repeat(2,minmax(0,1fr));}.ag-form {grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media(max-width:900px){.ag-layout-rota {grid-template-columns:1fr;}}
    @media(max-width:680px){.ag-form,.ag-sugestoes,.manual-form,.ag-resumo-rota {grid-template-columns:1fr;}.agenda-periodo{min-width:0;}.agenda-toolbar{align-items:flex-start;}.ag-submit{justify-content:stretch;}.ag-submit button{flex:1;}}


    /* FORNECEDORES — buscas independentes, cadastro e ficha */
    .for-toolbar {display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:5px 0 17px;}
    .for-filtros {display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) auto;gap:13px;align-items:end;margin:0 0 18px;}
    .for-filtros label,.for-form label {display:block;font-size:12px;font-weight:700;color:#52665a;}
    .for-filtros input,.for-form input,.for-form textarea {margin-top:6px;}
    .for-form {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}
    .for-form .full {grid-column:1/-1;}
    .for-form textarea {width:100%;min-height:96px;padding:11px 12px;border:1px solid #cfdbd3;border-radius:9px;resize:vertical;background:#fff;color:var(--texto);font:inherit;}
    .for-form textarea:focus-visible {outline:2px solid var(--verde);outline-offset:2px;}
    .for-form-acoes {grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:4px;}
    .for-name-link {font-weight:750;color:var(--texto);}
    .for-cnpj {display:block;font-size:11px;color:var(--suave);margin-top:3px;}
    .for-aberto {color:#9a6a23;font-weight:800;}
    .for-ficha-head {display:flex;align-items:center;gap:14px;min-width:0;}
    .for-ficha-avatar {display:grid;place-items:center;width:60px;height:60px;border-radius:13px;background:var(--verde-claro);color:var(--verde-escuro);font-size:26px;flex-shrink:0;}
    .for-ficha-head h2 {font-size:20px;margin-bottom:4px;}
    .for-ficha-head p {font-size:12px;color:var(--suave);}
    .for-ficha-topo {display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px;margin:16px 0 20px;}
    .for-observacao {color:#4f6356;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;}
    .for-vazio {text-align:center;color:var(--suave);padding:38px 14px;border:1px dashed #d5e2d9;border-radius:11px;background:#fbfcfb;}
    .for-meta-texto {color:var(--suave);font-size:12px;margin-top:7px;}
    .for-pedido-caption {color:var(--suave);font-size:11px;display:block;margin-top:3px;}
    @media(max-width:1100px){.for-filtros {grid-template-columns:1fr 1fr;}.for-filtros .botao{grid-column:1/-1;justify-self:start;}}
    @media(max-width:680px){.for-filtros,.for-form {grid-template-columns:1fr;}.for-form .full,.for-form-acoes{grid-column:1;}.for-ficha-topo{align-items:flex-start;flex-direction:column;}.for-form-acoes{flex-wrap:wrap;}}

    /* ORÇAMENTOS — pesquisa por código, cliente e intervalo inclusivo */
    .orc-filtros {display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(190px,1.1fr) minmax(140px,.75fr) minmax(140px,.75fr) auto;gap:13px;align-items:end;margin-bottom:15px;}
    .orc-filtros label {font-size:12px;color:#52665a;font-weight:700;}
    .orc-filtros input {margin-top:6px;min-height:42px;}
    .orc-filtros .botao {min-height:42px;white-space:nowrap;}
    .orc-head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .orc-tabela-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:22px 0 13px;}
    .orc-link{border-radius:3px;text-align:left;}
    .orc-erro{color:var(--vermelho);font-size:12px;margin:8px 0;}
    .orc-ficha-topo{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px;margin-bottom:20px;}
    .orc-ficha-cabecalho{display:flex;align-items:center;gap:16px;}
    .orc-ficha-cabecalho h2{font-size:23px;}
    .orc-ficha-icone{width:59px;height:59px;display:grid;place-items:center;background:var(--verde-claro);border-radius:14px;color:var(--verde-escuro);font-size:26px;}
    .orc-status-box{margin-top:20px;padding:15px;background:#f7faf8;border:1px solid var(--borda);border-radius:10px;display:grid;gap:9px;}
    .orc-status-box label{font-size:12px;color:#52665a;font-weight:750;}
    .orc-status-box select{max-width:350px;}
    .orc-urgente{padding:13px;background:#fff3e2;color:#925c1f;border:1px solid #f2ddb8;border-radius:9px;font-size:12px;margin-top:13px;}
    @media(max-width:1400px){.orc-filtros{grid-template-columns:repeat(2,minmax(0,1fr));}.orc-filtros .botao{justify-self:start;}}

    /* Fluxo Orçamento → OS → Obra/Serviço */

<body>

<script>
  // Altere os módulos aqui: cada item aparece no menu lateral e na Home.
  const modulos = [
    {id:'inicio', nome:'Início', icone:'⌂'},

  // DADOS ILUSTRATIVOS — substitua por dados do seu backend no produto real.

  let clientes = [];

  async function carregarClientesDoBackend() {
    try {
        const response = await fetch('/api/clientes/');
        const result = await response.json();

            clientes = result.data.map(c => ({
                id: String(c.id).padStart(6, '0'),
                dbId: c.id,
                nome: c.nome,
                cpf: c.cpf_cnpj,
                contato: c.telefone,
                status: c.status.charAt(0).toUpperCase() + c.status.slice(1)
            }));
            if (typeof atualizarListaClientes === 'function') {
                atualizarListaClientes();
            }
        }
    } catch (err) {
        console.error("Erro ao carregar clientes do banco:", err);
    }
  }

  // Executa a busca ao carregar a página
  carregarClientesDoBackend();

  const financeiro = {semana:{vendas:48750, custos:32180}, mes:{vendas:184900, custos:126430}, meta:200000};
  const FORNECEDORES_STORAGE = 'casa-das-artes-fornecedores-demo-v1';

    {id:'FOR-001',nome:'Distribuidora de Telhas Exemplo',cnpj:'00.000.000/0001-91',endereco:'Av. do Comércio, 250 - Centro, Rio de Janeiro / RJ',telefone:'(21) 3333-1000',categoria:'Telhas e coberturas',servico:'Telhas termoacústicas, telhas metálicas e acessórios para cobertura',observacoes:'Solicitar prazo de entrega e disponibilidade antes de confirmar a obra.'},
    {id:'FOR-002',nome:'Aços Modelo',cnpj:'00.000.000/0002-72',endereco:'Rua das Indústrias, 410 - Bonsucesso, Rio de Janeiro / RJ',telefone:'(21) 3333-2000',categoria:'Perfis e chapas',servico:'Perfis de aço, tubos metalon, chapas e corte sob medida',observacoes:'Atendimento comercial em dias úteis.'},
    {id:'FOR-003',nome:'Ferragens Alfa',cnpj:'00.000.000/0003-53',endereco:'Rua do Ferro, 80 - São Cristóvão, Rio de Janeiro / RJ',telefone:'(21) 3333-3000',categoria:'Ferragens e acessórios',servico:'Fechaduras, dobradiças, roldanas e kits para portões',observacoes:'Confirmar estoque para produtos especiais.'},

  ];
  let fornecedores;
  try {const salvos = JSON.parse(localStorage.getItem(FORNECEDORES_STORAGE)); fornecedores = Array.isArray(salvos) ? salvos : fornecedoresIniciais;}
  catch {fornecedores = fornecedoresIniciais;}
  const pedidosFornecedor = [
    {id:'PC-2026-041',fornecedorId:'FOR-001',data:'2026-11-04',descricao:'Telhas termoacústicas',quantidade:'85 m²',valor:11800,status:'Aguardando entrega',previsao:'2026-11-14'},
    {id:'PC-2026-029',fornecedorId:'FOR-001',data:'2026-10-17',descricao:'Parafusos autoperfurantes',quantidade:'400 un.',valor:760,status:'Recebido',previsao:'2026-10-23'},
    {id:'PC-2026-035',fornecedorId:'FOR-002',data:'2026-11-01',descricao:'Tubos metalon',quantidade:'130 m',valor:6900,status:'Solicitado',previsao:'2026-11-16'},
    {id:'PC-2026-020',fornecedorId:'FOR-002',data:'2026-10-10',descricao:'Chapas galvanizadas',quantidade:'30 un.',valor:4950,status:'Recebido',previsao:'2026-10-18'},
    {id:'PC-2026-039',fornecedorId:'FOR-003',data:'2026-11-03',descricao:'Fechaduras e dobradiças',quantidade:'20 kits',valor:1820,status:'Confirmado',previsao:'2026-11-12'},
    {id:'PC-2026-017',fornecedorId:'FOR-003',data:'2026-09-29',descricao:'Roldanas para portão',quantidade:'16 un.',valor:1280,status:'Recebido',previsao:'2026-10-03'},
    {id:'PC-2026-022',fornecedorId:'FOR-004',data:'2026-10-14',descricao:'Pintura de grades',quantidade:'1 serviço',valor:3150,status:'Finalizado',previsao:'2026-10-25'}
  ];
  const contratos = [
    {numero:'CT-2026-015', cliente:'João da Silva', objeto:'Instalação de portão', situacao:'Em execução'},
    {numero:'CT-2026-014', cliente:'Maria Oliveira', objeto:'Cobertura metálica', situacao:'Assinado'},
    {numero:'CT-2026-013', cliente:'Carlos Pereira', objeto:'Reforma de grade', situacao:'Finalizado'}
  ];
  const pedidos = [
    {codigo:'PED-0142', clienteId:'000142', data:'2026-11-04', descricao:'Portão sob medida', valor:2450, status:'Concluído'},
    {codigo:'PED-0131', clienteId:'000141', data:'2026-10-29', descricao:'Manutenção de grade', valor:480, status:'Em andamento'},
    {codigo:'PED-0120', clienteId:'000140', data:'2026-10-20', descricao:'Janela de alumínio', valor:1380, status:'Concluído'}
  ];
  function somarDias(n) { let d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  const orcamentosIniciais = [
    {id:'ORC-1001',cliente:'João da Silva',servico:'Portão automático',valor:5200,envio:somarDias(-9),proximoContato:somarDias(-3),status:'Aguardando retorno'},
    {id:'ORC-1002',cliente:'Maria Oliveira',servico:'Cobertura de telhas',valor:12300,envio:somarDias(-6),proximoContato:somarDias(-1),status:'Aguardando retorno'},
    {id:'ORC-1003',cliente:'Carlos Pereira',servico:'Guarda-corpo',valor:2400,envio:somarDias(-2),proximoContato:somarDias(2),status:'Aguardando retorno'},
    {id:'ORC-1004',cliente:'Fernanda Costa',servico:'Portão de garagem',valor:6900,envio:somarDias(-1),proximoContato:somarDias(3),status:'Aguardando retorno'},
    {id:'ORC-1005',cliente:'João da Silva',servico:'Reparo de grade',valor:700,envio:somarDias(-15),proximoContato:somarDias(-8),status:'Em negociação'},
    {id:'ORC-1006',cliente:'Maria Oliveira',servico:'Janela de alumínio',valor:4200,envio:somarDias(-21),proximoContato:somarDias(-14),status:'Aprovado'}
  ];
  const CHAVE = 'casa-das-artes-orcamentos-demo-v1';
  let orcamentos;
  try { const salvos=JSON.parse(localStorage.getItem(CHAVE)); orcamentos=Array.isArray(salvos)?salvos:orcamentosIniciais; }
  catch { orcamentos=orcamentosIniciais; }
  // Os orçamentos usam a mesma base nas três interfaces: lista geral,
  // follow-up de vendas e ficha individual do cliente.
  for (const orc of orcamentos) {
    if (!orc.clienteId) {
      const cli=clientes.find(c=>c.nome.toLocaleLowerCase('pt-BR')===String(orc.cliente||'').toLocaleLowerCase('pt-BR'));
      if(cli) orc.clienteId=cli.id; // compatibilidade com registros de versões anteriores
    }
  }

  /* ================================================================
     FLUXO COMERCIAL E EXECUÇÃO
     ORÇAMENTO (aprovado) -> ORDEM DE SERVIÇO -> OBRA OU SERVIÇO.
     Os pedidos da versão anterior viram registros LEGADOS navegáveis,
     sem inventar origem orçamentária nem vincular obras incorretas.
     No produto real, geração e vínculos exigem transação no backend.
     ================================================================ */
  const CHAVE_OS='casa-das-artes-ordens-servico-demo-v1';
  const ordensLegadas=pedidos.map(p=>({
    id:p.codigo, clienteId:p.clienteId, orcamentoId:'', obraId:'',
    servico:p.descricao, valor:p.valor, data:p.data,
    status:p.status==='Concluído'?'Concluída':p.status==='Em andamento'?'Em execução':p.status,
    legado:true
  }));
  let ordensServico;
  try{
    const gravadas=JSON.parse(localStorage.getItem(CHAVE_OS));
    ordensServico=Array.isArray(gravadas)?gravadas:ordensLegadas;
  }catch(e){ordensServico=ordensLegadas;}
  let osAtual=null, filtroOS='', filtroOSCliente='', osParaNovaObraId=null, origemOSOrcamento=null;
  function salvarOS(){try{localStorage.setItem(CHAVE_OS,JSON.stringify(ordensServico));}catch(e){console.warn('Persistência OS indisponível',e);}}
  function osDoOrcamento(id){return ordensServico.find(x=>x.orcamentoId===id)||null;}
  function obraDaOS(id){return obras.find(x=>x.osId===id)||null;}
  function gerarCodigoOS(){
    const ano=new Date().getFullYear();
    let n=1, id;
    do{id=`OS-${ano}-${String(n++).padStart(4,'0')}`;}while(ordensServico.some(o=>o.id===id));
    return id;
  }
  function garantirOSDoOrcamento(o){
    if(!o||o.status!=='Aprovado')return null;
    const existente=osDoOrcamento(o.id);
    if(existente)return existente;
    const cliente=clienteDoOrcamento(o);
    if(!cliente)return null;
    const nova={id:gerarCodigoOS(),clienteId:cliente.id,orcamentoId:o.id,obraId:'',
      servico:o.servico,valor:Number(o.valor)||0,data:somarDias(0),status:'Aguardando planejamento',legado:false};
    ordensServico.unshift(nova);salvarOS();return nova;
  }
  function fluxoRelacionamento(orc,os,obra){
    const passo=(indice,titulo,id,acao,sub)=>`<div class="fluxo-passo"><span class="fluxo-num">${indice}</span><div><small>${esc(titulo)}</small>${id?`<button class="link fluxo-link" onclick="${acao}">${esc(id)} ↗</button>`:`<b class="fluxo-pendente">${esc(sub||'Aguardando etapa anterior')}</b>`}</div></div>`;
    return `<div class="fluxo-card"><div class="card-titulo"><span class="sinal">↔</span><h2>Rastreabilidade comercial e operacional</h2></div><div class="fluxo-grid">
      ${passo(1,'Orçamento',orc?.id,orc?`abrirOrcamento('${esc(orc.id)}','ordens')`:null,os?.legado?'Pedido legado sem orçamento':'Orçamento não vinculado')}
      ${passo(2,'Ordem de serviço',os?.id,os?`abrirOS('${esc(os.id)}')`:null,orc?.status==='Aprovado'?'Preparando OS':'Aprovação necessária')}
      ${passo(3,'Obra / Serviço',obra?.id,obra?`abrirObra('${esc(obra.id)}')`:null,os?'Aguardando início':'Aguardando OS')}
    </div></div>`;
  }

  let paginaAtual='inicio', clienteAtual=null, abaAtual='dados', pesquisaCliente='', filtroOrcamento='Todos';
  let orcamentoAtual=null, origemFichaOrcamento='orcamentos', origemClienteOrcamento=null;
  let pesquisaOrcamentoCodigo='', pesquisaOrcamentoCliente='', dataOrcamentoInicial='', dataOrcamentoFinal='';
  let fornecedorAtual=null, fornecedorAba='dados', formularioFornecedorVisivel=false, fornecedorEdicaoId=null, buscaFornecedorNome='', buscaFornecedorCategoria='';
  let obraAtual=null, obrasFiltroId='', obrasFiltroCliente='', obrasFiltroInicio='', obrasFiltroFim='', obrasFiltroStatus='Em andamento', formularioNovaObra=false;
  let historicoFiltro='Todos', formularioDocumentoAberto=false;
  const elPagina=document.getElementById('pagina');
  const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
  const fmtData=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pendentes=()=>orcamentos.filter(o=>o.status==='Aguardando retorno');

  async function abrirModalNovoCliente() {
    const nome = prompt("Nome do Cliente:");
    if (!nome) return;
    
    const cpf_cnpj = prompt("CPF ou CNPJ:");
    if (!cpf_cnpj) return;
    
    const telefone = prompt("Telefone:");
    if (!telefone) return;

    try {
        const response = await fetch('/api/clientes/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ nome, cpf_cnpj, telefone })
        });
        
        const result = await response.json();
        if (response.ok) {
            alert('Cliente cadastrado com sucesso no PostgreSQL!');
            location.reload(); // Recarrega a página para atualizar a tabela com o novo cliente do banco
        } else {
            alert('Erro ao cadastrar: ' + (result.message || JSON.stringify(result)));
        }
    } catch (err) {
        alert('Erro na requisição: ' + err);
    }
  }

  // Função auxiliar para capturar o token CSRF do Django
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
  }

    function exibirFormularioOrcamento(){
    const html=`<section class="card card-pad" style="margin-bottom:18px"><div class="cabecalho"><h2>Novo orçamento</h2><button class="link" onclick="document.getElementById('areaFormulario').innerHTML=''">Fechar ×</button></div><form onsubmit="cadastrarOrcamento(event)"><div class="form-grid"><label>Cliente<select name="cliente" required>${clientes.map(c=>`<option value="${esc(c.nome)}">${esc(c.nome)}</option>`).join('')}</select></label><label>Serviço ou material<input class="campo-input" name="servico" required maxlength="120" placeholder="Ex.: Cobertura metálica" /></label><label>Valor orçado (R$)<input class="campo-input" name="valor" type="number" min="0.01" step="0.01" required /></label><label>Data de envio<input class="campo-input" name="envio" type="date" value="${somarDias(0)}" required /></label><label>Próximo contato<input class="campo-input" name="proximoContato" type="date" value="${somarDias(3)}" required /></label></div><div style="margin-top:15px"><button class="botao" type="submit">Salvar orçamento</button></div></form></section>`;
    document.getElementById('areaFormulario').innerHTML=html;
  }
  function cadastrarOrcamento(ev){
    ev.preventDefault();
    const f=new FormData(ev.target);
    const novo={id:'ORC-'+Date.now().toString().slice(-8),cliente:String(f.get('cliente')),servico:String(f.get('servico')).trim(),valor:Number(f.get('valor')),envio:String(f.get('envio')),proximoContato:String(f.get('proximoContato')),status:'Aguardando retorno'};
    novo.clienteId=clientes.find(c=>c.nome===novo.cliente)?.id||null;
    if(!novo.servico||!Number.isFinite(novo.valor)||novo.valor<=0||!novo.envio||!novo.proximoContato){alert('Preencha os campos corretamente.');return;}
    if(novo.proximoContato<novo.envio){alert('O próximo contato deve ser na data de envio ou posterior.');return;}
    orcamentos.unshift(novo); salvar(); filtroOrcamento='Todos'; render();
  }
  function alterarStatus(id,status){
    if(!['Aguardando retorno','Em negociação','Aprovado','Recusado'].includes(status))return;
    const o=orcamentos.find(x=>x.id===id);if(!o)return;
    const ordem=osDoOrcamento(id);
    if(ordem&&status!=='Aprovado'){
      alert('Este orçamento já originou a ordem de serviço '+ordem.id+'. Para preservar a rastreabilidade, ele não pode ser desfeito diretamente. Gerencie cancelamentos na ordem de serviço.');
      render();return;
    }
    if(status==='Aprovado'&&!clienteDoOrcamento(o)){
      alert('Associe o orçamento a um cliente cadastrado antes de aprová-lo.');render();return;
    }
    o.status=status;
    salvar();
    if(status==='Aprovado')garantirOSDoOrcamento(o); // idempotente
    render();
  }

  /* ==========================================================

  function textoNormalizado(t){return String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
  function salvarFornecedores(){try{localStorage.setItem(FORNECEDORES_STORAGE,JSON.stringify(fornecedores));}catch(e){console.warn('Não foi possível salvar fornecedores localmente:',e);}}
  function normalizarCnpj(v){return String(v??'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
  function formatarCnpj(v){const c=normalizarCnpj(v);return c.length===14?`${c.slice(0,2)}.${c.slice(2,5)}.${c.slice(5,8)}/${c.slice(8,12)}-${c.slice(12,14)}`:String(v||'');}
  function pedidosDoFornecedor(id){return pedidosFornecedor.filter(p=>p.fornecedorId===id);}
  function pedidoAberto(p){return !['Recebido','Finalizado','Cancelado'].includes(p.status);}
  function filtrarFornecedores(){
    const nome=textoNormalizado(buscaFornecedorNome), cat=textoNormalizado(buscaFornecedorCategoria);
    return fornecedores.filter(f=>textoNormalizado(f.nome).includes(nome)&&textoNormalizado(f.categoria).includes(cat));
  }
  function listaFornecedoresLinhas(){

    }).join('') || '<tr><td class="sem-resultado" colspan="5">Nenhum fornecedor encontrado para os filtros informados.</td></tr>';
  }
  function atualizarBuscaFornecedor(campo,valor){
    if(campo==='nome')buscaFornecedorNome=valor;
    if(campo==='categoria')buscaFornecedorCategoria=valor;
    const body=document.getElementById('fornecedoresLinhas');

    const contador=document.getElementById('fornecedoresContador');

  function abrirFornecedor(id){

    if(!fornecedorAtual)return;
    paginaAtual='fornecedores';fornecedorAba='dados';formularioFornecedorVisivel=false;fornecedorEdicaoId=null;
    render();window.scrollTo(0,0);
  }
  function abrirFormularioFornecedor(id=null){

      <div class="mini-indicadores">${kpi('Fornecedores cadastrados',fornecedores.length,'Empresas na base')}${kpi('Categorias cadastradas',categorias.length,'Tipos de fornecimento')}${kpi('Pedidos de compra abertos',numAbertos,'Pedidos fictícios do protótipo')}</div>

        <div class="tabela-wrap"><table><thead><tr><th>Empresa / abrir cadastro</th><th>Categoria</th><th>Tipo de serviço fornecido</th><th>Telefone</th><th>Pedidos abertos</th></tr></thead><tbody id="fornecedoresLinhas">${listaFornecedoresLinhas()}</tbody></table></div>

  function formularioFornecedor(){
    const f=fornecedores.find(x=>x.id===fornecedorEdicaoId)||{};
    const editando=!!f.id;
    const categorias=[...new Set(fornecedores.map(x=>x.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const campo=(nome,titulo,tipo='text',placeholder='',obrigatorio=true,max=200)=>`<label>${titulo}<input class="campo-input" type="${tipo}" name="${nome}" value="${esc(f[nome]||'')}" placeholder="${esc(placeholder)}" maxlength="${max}" ${obrigatorio?'required':''}></label>`;
    return `<button class="link" type="button" onclick="cancelarFormularioFornecedor()">← Voltar aos fornecedores</button><div style="height:12px"></div>
      ${cabecalho(editando?'Editar fornecedor':'Novo fornecedor',editando?'Atualize os dados cadastrais da empresa':'Preencha o cadastro da empresa fornecedora')}

        ${campo('cnpj','CNPJ','text','00.000.000/0001-00 (aceita letras)',true,18)}
        <label class="full">Endereço completo<input class="campo-input" type="text" name="endereco" value="${esc(f.endereco||'')}" placeholder="Logradouro, número, complemento, bairro, cidade, UF e CEP" maxlength="250" required></label>
        ${campo('telefone','Telefone','tel','(21) 3333-0000',true,30)}
        <label>Categoria<input class="campo-input" name="categoria" type="text" list="listaCategoriasFornecedor" value="${esc(f.categoria||'')}" placeholder="Ex.: Telhas e coberturas" maxlength="90" required></label>
        <label class="full">Tipo de serviço fornecido<input class="campo-input" name="servico" type="text" value="${esc(f.servico||'')}" placeholder="Ex.: Fornecimento de telhas, frete e instalação" maxlength="250" required></label>

        <p class="notinha full" style="margin-top:0">O CNPJ pode ser numérico ou alfanumérico (14 posições). Este formulário verifica o formato, não a situação cadastral na Receita Federal.</p>
        <div class="for-form-acoes"><button type="button" class="botao botao-outline" onclick="cancelarFormularioFornecedor()">Cancelar</button><button type="submit" class="botao">${editando?'Salvar alterações':'Cadastrar fornecedor'}</button></div>
      </form></section>`;
  }
  function salvarCadastroFornecedor(ev){
    ev.preventDefault();
    const f=new FormData(ev.currentTarget);
    const dados={nome:String(f.get('nome')||'').trim(),endereco:String(f.get('endereco')||'').trim(),cnpj:normalizarCnpj(f.get('cnpj')),telefone:String(f.get('telefone')||'').trim(),categoria:String(f.get('categoria')||'').trim(),servico:String(f.get('servico')||'').trim(),observacoes:String(f.get('observacoes')||'').trim()};
    if(['nome','endereco','cnpj','telefone','categoria','servico'].some(c=>!dados[c])){alert('Preencha todos os campos obrigatórios.');return;}
    if(!/^[A-Z0-9]{12}[0-9]{2}$/.test(dados.cnpj)){alert('O CNPJ deve ter 14 posições: as 12 primeiras podem conter letras ou números, e as 2 últimas devem ser dígitos.');return;}
    const duplicado=fornecedores.some(x=>normalizarCnpj(x.cnpj)===dados.cnpj&&x.id!==fornecedorEdicaoId);
    if(duplicado){alert('Já existe um fornecedor cadastrado com este CNPJ.');return;}
    let id=fornecedorEdicaoId;
    if(id){const idx=fornecedores.findIndex(x=>x.id===id);if(idx<0)return;fornecedores[idx]={...fornecedores[idx],...dados,cnpj:formatarCnpj(dados.cnpj)};}
    else {id='FOR-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();fornecedores.unshift({id,...dados,cnpj:formatarCnpj(dados.cnpj)});}
    salvarFornecedores();
    fornecedorEdicaoId=null;formularioFornecedorVisivel=false;buscaFornecedorNome='';buscaFornecedorCategoria='';
    abrirFornecedor(id);
  }

  /* ===========================================================
     MÓDULO AGENDAMENTO — PROTÓTIPO NAVEGÁVEL
     - Horários: seg-sex 08-12 / 13-18 e sáb 08-12
     - Visitas de 60 minutos; folga logística de 10 min
     - 4 sugestões: 2 manhã e 2 tarde, em dias/horas únicos

     - Para produção, substituir calcularKmDemo() por API de rotas

     =========================================================== */
  const CONFIG_AGENDA = {
    duracaoMin:60, intervaloLogisticoMin:10,
    velocidadeMediaKmH:35, maxEntreVisitasKm:30,
    antecedenciaMin:120, diasBusca:28,

  function dataBrasilia(){
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const v=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
    return `${v.year}-${v.month}-${v.day}`;
  }
  function horarioBrasilia(){
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    const v=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
    return Number(v.hour)*60+Number(v.minute);
  }
  function parseISO(s){return new Date(`${s}T12:00:00`);}
  function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function addDias(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return toISO(d);}
  function segundaFeira(s){const d=parseISO(s);const ds=(d.getDay()+6)%7;d.setDate(d.getDate()-ds);return toISO(d);}
  function diaNum(s){return parseISO(s).getDay();}
  function curto(s){return parseISO(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
  function legivel(s){return parseISO(s).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});}
  function horaStr(h){return String(h).padStart(2,'0')+':00';}
  function minutos(h){return h*60;}
  function horaComercial(s,h){const d=diaNum(s);return d===6?(h>=8&&h<12):(d>=1&&d<=5&&(h>=8&&h<12||h>=13&&h<18));}
  function futuroPermitido(s,h){return s>dataBrasilia()||(s===dataBrasilia()&&minutos(h)>=horarioBrasilia()+CONFIG_AGENDA.antecedenciaMin);}
  function seedAgenda(){
    const base=segundaFeira(dataBrasilia());

      [0,9,'000142','tijuca','Medição de portão'],[0,14,'000141','meier','Visita técnica'],

    return configs.map(([off,h,id,bairro,tipo],i)=>({

      bairro,tipo,endereco:'',observacao:'Agendamento fictício de demonstração',manual:false
    }));

  function proximoDiaAberto(){
    for(let i=1;i<=7;i++){const data=addDias(dataBrasilia(),i);if(diaNum(data)!==0)return data;}
    return addDias(dataBrasilia(),1);
  }
  function salvarAgenda(){try{localStorage.setItem(CHAVE_AGENDA,JSON.stringify(agendamentos));}catch(e){console.warn('Armazenamento local indisponível',e);}}
  function visitasDia(data){return agendamentos.filter(a=>a.data===data).slice().sort((a,b)=>a.hora-b.hora);}
  function kmLinha(a,b){
    const r=Math.PI/180, R=6371;
    const dLat=(b.lat-a.lat)*r, dLon=(b.lng-a.lng)*r;
    const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
  }
  function coordDe(bairro){const b=locaisAgenda[bairro]||locaisAgenda.centro;return {lat:b.lat,lng:b.lng};}
  // SOMENTE PROTÓTIPO. O fator não representa distâncias rodoviárias reais.
  function calcularKmDemo(bairroA,bairroB){return kmLinha(coordDe(bairroA),coordDe(bairroB))*1.3;}
  function minutosDeslocamento(km){return Math.ceil(km/CONFIG_AGENDA.velocidadeMediaKmH*60)+CONFIG_AGENDA.intervaloLogisticoMin;}
  function verificarPossibilidade(data,h,bairro){
    const resultado={permitido:true,avisos:[],kmAdicional:0,distanciaMax:0,logisticaOk:true};
    if(!horaComercial(data,h)){resultado.permitido=false;resultado.avisos.push('Fora do horário comercial.');return resultado;}
    if(!futuroPermitido(data,h)){resultado.permitido=false;resultado.avisos.push('Data passada ou antecedência menor que 2 horas.');return resultado;}
    const visitas=visitasDia(data);
    if(visitas.some(v=>v.hora===h)){
      resultado.permitido=false;resultado.avisos.push('Horário ocupado.');return resultado;
    }
    const anterior=visitas.filter(v=>v.hora<h).at(-1)||null;
    const proxima=visitas.find(v=>v.hora>h)||null;
    const kmA=anterior?calcularKmDemo(anterior.bairro,bairro):0;
    const kmP=proxima?calcularKmDemo(bairro,proxima.bairro):0;
    const kmDireto=anterior&&proxima?calcularKmDemo(anterior.bairro,proxima.bairro):0;
    resultado.kmAdicional=Math.max(0,kmA+kmP-kmDireto);
    resultado.distanciaMax=Math.max(kmA,kmP);
    if(kmA>CONFIG_AGENDA.maxEntreVisitasKm || kmP>CONFIG_AGENDA.maxEntreVisitasKm){
      resultado.logisticaOk=false;
      resultado.avisos.push(`Distância estimada de ${resultado.distanciaMax.toFixed(1).replace('.',',')} km entre visitas (limite de 30 km).`);
    }
    if(anterior && (h-anterior.hora)*60 < CONFIG_AGENDA.duracaoMin+minutosDeslocamento(kmA)){
      resultado.logisticaOk=false;resultado.avisos.push('Sem tempo suficiente de deslocamento após a visita anterior.');
    }
    if(proxima && (proxima.hora-h)*60 < CONFIG_AGENDA.duracaoMin+minutosDeslocamento(kmP)){
      resultado.logisticaOk=false;resultado.avisos.push('Sem tempo suficiente de deslocamento antes da próxima visita.');
    }
    return resultado;
  }
  function atualizarClienteAgenda(id){

    const tipo=document.getElementById('agTipo');const endereco=document.getElementById('agEndereco');

  function gerarSugestoesAgenda(){
    pegarCamposAgenda();
    if(!formAgenda.tipo){alert('Informe o tipo de visita.');return;}
    const candidatos=[]; const base=dataBrasilia();
    for(let dias=0;dias<CONFIG_AGENDA.diasBusca;dias++){
      const data=addDias(base,dias);
      for(const h of CONFIG_AGENDA.horasSugestoes){
        const checagem=verificarPossibilidade(data,h,formAgenda.bairro);
        if(checagem.permitido&&checagem.logisticaOk){
          candidatos.push({data,h,turno:h<12?'manha':'tarde',
            kmAdicional:checagem.kmAdicional,score:checagem.kmAdicional*3+dias*.3+h*.005});
        }
      }
    }
    candidatos.sort((a,b)=>a.score-b.score||a.data.localeCompare(b.data)||a.h-b.h);
    let escolhidas=[];const datas=new Set(),horarios=new Set();
    for(const turno of ['manha','tarde']){
      for(const item of candidatos){
        if(item.turno!==turno||datas.has(item.data)||horarios.has(item.h))continue;
        if(escolhidas.filter(x=>x.turno===turno).length>=2)break;
        escolhidas.push(item);datas.add(item.data);horarios.add(item.h);
      }
    }
    opcoesAgenda=escolhidas;render();
    document.getElementById('ag-sugestoes')?.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function confirmarAgenda(data,h,manual){
    pegarCamposAgenda();
    const checagem=verificarPossibilidade(data,h,formAgenda.bairro);
    if(!checagem.permitido){alert('Não é possível confirmar: '+checagem.avisos.join(' '));return;}
    if(manual&&!checagem.logisticaOk){
      const autorizar=document.getElementById('ag-excecao')?.checked;
      if(!autorizar){alert('Existem alertas logísticos: '+checagem.avisos.join(' ')+'\nMarque a autorização de exceção para continuar.');return;}
    } else if(!manual&&!checagem.logisticaOk){
      alert('O horário deixou de atender às regras de deslocamento. Gere novas sugestões.');return;
    }
    const cliente=clientes.find(c=>c.id===formAgenda.clienteId);
    if(!cliente){alert('Selecione um cliente válido.');return;}
    agendamentos.push({id:'AG-'+Date.now(),data,hora:h,clienteId:cliente.id,cliente:cliente.nome,
      bairro:formAgenda.bairro,tipo:formAgenda.tipo,endereco:formAgenda.endereco,
      observacao:formAgenda.observacao,manual:!!manual});
    salvarAgenda();agendaFormAberto=false;opcoesAgenda=[];semanaAgenda=segundaFeira(data);diaAgenda=data;render();
    document.getElementById('rotas-dia')?.scrollIntoView({behavior:'smooth',block:'start'});

      <div class="agenda-chamada"><b>Como funciona:</b> o sistema procura 2 opções pela manhã e 2 à tarde, em datas e horários diferentes, considerando os compromissos existentes, o limite ilustrativo de 30 km entre visitas consecutivas e uma margem de deslocamento. A quinta opção é manual e sinaliza exceções.</div>

        <label class="ag-full">Observação<input id="agObs" class="campo-input" maxlength="250" value="${esc(formAgenda.observacao)}" placeholder="Ex.: Cliente disponível após 9h" /></label>

        ${opcoesAgenda.length&&opcoesAgenda.length<4?'<div class="ag-rota-avisos">Não foram encontrados quatro horários que atendam a todas as regras. Você pode tentar outra região ou usar a opção manual.</div>':''}

  function atualizarAvisoManual(){

  function prepararAvisoManual(){if(agendaFormAberto)atualizarAvisoManual();}
  function roteiroDoDia(data){
    const lista=visitasDia(data);
    if(!lista.length)return `<section id="rotas-dia" class="card card-pad ag-section"><div class="cabecalho"><div>${titulo('Rota sugerida · '+esc(legivel(data)),'⌖')}<p class="suave">A rota aparece após selecionar o dia na agenda.</p></div></div><div class="ag-vazio">Nenhuma visita agendada neste dia. A rota será calculada após um agendamento.</div></section>`;
    const pontos=[{...ESCRITORIO_DEMO,base:true},...lista.map(v=>({...coordDe(v.bairro),nome:locaisAgenda[v.bairro]?.nome||v.bairro,base:false}))];
    let kmTotal=0,avisos=[]; let deslocamento=0;
    let anterior=null;
    for(let i=0;i<lista.length;i++){
      const visita=lista[i];const atual=coordDe(visita.bairro);
      const from=anterior?coordDe(anterior.bairro):ESCRITORIO_DEMO;
      const trecho=kmLinha(from,atual)*1.3;
      kmTotal+=trecho;deslocamento+=minutosDeslocamento(trecho);
      if(anterior){
        if(trecho>CONFIG_AGENDA.maxEntreVisitasKm) avisos.push(`${anterior.cliente} → ${visita.cliente}: ${trecho.toFixed(1)} km estimados (acima de 30 km).`);
        if((visita.hora-anterior.hora)*60<CONFIG_AGENDA.duracaoMin+minutosDeslocamento(trecho))avisos.push(`Possível atraso entre as visitas de ${horaStr(anterior.hora)} e ${horaStr(visita.hora)}.`);
      }
      anterior=visita;
    }
    const volta=kmLinha(coordDe(lista.at(-1).bairro),ESCRITORIO_DEMO)*1.3;
    kmTotal+=volta;deslocamento+=minutosDeslocamento(volta);
    pontos.push({...ESCRITORIO_DEMO,base:true,final:true});
    const lats=pontos.map(p=>p.lat),lngs=pontos.map(p=>p.lng);
    const xMin=Math.min(...lngs)-.016,xMax=Math.max(...lngs)+.016;
    const yMin=Math.min(...lats)-.016,yMax=Math.max(...lats)+.016;
    const xy=p=>({x:30+(p.lng-xMin)/(xMax-xMin)*500,y:260-(p.lat-yMin)/(yMax-yMin)*210});
    const listaPontos=pontos.map(xy);
    const linhas=listaPontos.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const grid=Array.from({length:7},(_,i)=>`<line x1="${i*90}" x2="${i*90}" y1="0" y2="310" stroke="#deebe2" stroke-width="1" />`).join('')+Array.from({length:5},(_,i)=>`<line y1="${i*77}" y2="${i*77}" x1="0" x2="560" stroke="#deebe2" stroke-width="1" />`).join('');
    const marcadores=listaPontos.slice(0,-1).map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${i===0?15:13}" fill="${i===0?'#303a3f':'#468b59'}" stroke="white" stroke-width="3"/><text x="${p.x}" y="${p.y+4}" fill="white" font-weight="bold" text-anchor="middle" font-size="12">${i===0?'B':i}</text>`).join('');
    const itens=lista.map((v,i)=>`<div class="ag-rota-item"><div class="ag-passo">${i+1}</div><div><strong>${horaStr(v.hora)} — ${esc(v.cliente)}</strong><p>${esc(v.tipo)} · ${esc(locaisAgenda[v.bairro]?.nome||v.bairro)}</p>${v.manual?'<span class="chip chip-laranja">Manual</span>':''}</div></div>`).join('');
    const origem='Centro, Rio de Janeiro, RJ';

  function agenda(){

    const rows=CONFIG_AGENDA.horas.map(h=>{

        const aberto=horaComercial(d,h),agendaVisita=visitasDia(d).find(a=>a.hora===h);

        if(agendaVisita)return `<button type="button" class="agenda-celula ocupado ${d===diaAgenda?'selecionado':''} ${passado?'passado':''}" onclick="selecionarCelulaAgenda('${d}',${h})"><span class="agenda-tag"><b>${esc(agendaVisita.cliente)}</b>${esc(locaisAgenda[agendaVisita.bairro]?.nome||'Visita')}</span></button>`;
        return `<button type="button" class="agenda-celula ${d===diaAgenda?'selecionado':''} ${passado?'passado':''}" onclick="selecionarCelulaAgenda('${d}',${h})"><span class="agenda-vago">${passado?'—':'Livre'}</span></button>`;
      }).join('');return `<div class="agenda-hora">${horaStr(h)}</div>${cells}`;
    }).join('');
    return `${cabecalho('Agendamento','Agenda semanal do vendedor · horários e deslocamentos previstos',`<button class="botao" onclick="abrirFormAgenda()">+ Novo agendamento</button>`)}
      <div class="mini-indicadores">${kpi('Visitas na semana',total,'Segunda-feira a domingo')}${kpi('Visitas no dia selecionado',visitasDia(diaAgenda).length,curto(diaAgenda))}${kpi('Limite entre visitas','30 km','Distância viária: exige integração')}</div>

        <div class="agenda-legenda"><span><i class="legenda-bola" style="background:#468b59"></i>Agendado</span><span><i class="legenda-bola" style="background:#cddbd1"></i>Disponível</span><span><i class="legenda-bola" style="background:#c5cdc8"></i>Fechado / almoço</span><span>Fuso: Brasília (UTC−3)</span></div>
        <div class="agenda-scroller"><div class="agenda-calendario">${cab}${rows}</div></div><p class="notinha">Clique na data ou em um horário para consultar o roteiro do dia. Visitas fictícias demonstrativas; não é uma agenda compartilhada real.</p></section>
      ${roteiroDoDia(diaAgenda)}`;
  }

    {id:'OBR-2026-039',clienteId:'000140',orcamentoId:'ORC-1003',servico:'Guarda-corpo em aço',inicio:somarDias(-28),prazo:somarDias(-3),progresso:75,status:'Em andamento',responsavel:'Equipe de soldagem',endereco:'Vila Isabel, Rio de Janeiro / RJ',observacao:'Prazo ultrapassado; concluir acabamento e vistoria.'},
    {id:'OBR-2026-038',clienteId:'000139',orcamentoId:'ORC-1004',servico:'Portão de garagem',inicio:somarDias(-16),prazo:somarDias(19),progresso:31,status:'Em andamento',responsavel:'Equipe de fabricação',endereco:'Barra da Tijuca, Rio de Janeiro / RJ',observacao:'Estrutura em fase de fabricação.'},
    {id:'OBR-2026-037',clienteId:'000142',orcamentoId:'ORC-1005',servico:'Reparo de cobertura e calhas',inicio:somarDias(-37),prazo:somarDias(-7),progresso:88,status:'Em andamento',responsavel:'Equipe de manutenção',endereco:'Centro, Rio de Janeiro / RJ',observacao:'Atraso devido à entrega de materiais.'},
    {id:'OBR-2026-036',clienteId:'000141',orcamentoId:'ORC-1006',servico:'Reforço de estrutura metálica',inicio:somarDias(-50),prazo:somarDias(-11),progresso:100,status:'Concluída',responsavel:'Equipe de instalação B',endereco:'Tijuca, Rio de Janeiro / RJ',observacao:'Entrega e aceite concluídos.'}
  ];
  let obras;
  try{const salvas=JSON.parse(localStorage.getItem(OBRAS_STORAGE));obras=Array.isArray(salvas)?salvas:obrasIniciais;}
  catch{obras=obrasIniciais;}
  function salvarObras(){try{localStorage.setItem(OBRAS_STORAGE,JSON.stringify(obras));}catch(e){console.warn('Sem persistência local para obras',e);}}
  function clienteDaObra(ob){return clientes.find(c=>c.id===ob.clienteId)||null;}
  function statusPrazoObra(ob){if(ob.status!=='Em andamento')return ob.status;return ob.prazo<somarDias(0)?'Em atraso':'Dentro do prazo';}
  function obrasEmAndamento(){return obras.filter(o=>o.status==='Em andamento');}
  function abertasNoPrazo(){return obrasEmAndamento().filter(o=>o.prazo>=somarDias(0));}
  function abertasEmAtraso(){return obrasEmAndamento().filter(o=>o.prazo<somarDias(0));}
  function filtrarObras(){
    const id=textoNormalizado(obrasFiltroId),cliente=textoNormalizado(obrasFiltroCliente);
    return obras.filter(o=>{
      const c=clienteDaObra(o);
      return textoNormalizado(o.id).includes(id)&&textoNormalizado(c?.nome||'').includes(cliente)
        &&(!obrasFiltroInicio||o.inicio>=obrasFiltroInicio)&&(!obrasFiltroFim||o.inicio<=obrasFiltroFim)
        &&(obrasFiltroStatus==='Todas'||o.status===obrasFiltroStatus);
    }).sort((a,b)=>b.inicio.localeCompare(a.inicio));
  }
  function obraTabelaLinhas(){return filtrarObras().map(o=>{
    const cliente=clienteDaObra(o), atrasada=statusPrazoObra(o)==='Em atraso';
    return `<tr><td><button class="link" onclick="abrirObra('${esc(o.id)}')">${esc(o.id)} ↗</button></td>
      <td><button class="link" onclick="abrirCliente('${esc(cliente?.id||'')}')">${esc(cliente?.nome||'Cliente não encontrado')}</button></td>
      <td>${esc(o.servico)}<small class="suave" style="display:block">${esc(o.responsavel||'')}</small></td>
      <td>${o.osId?`<button class="link" onclick="abrirOS('${esc(o.osId)}')">${esc(o.osId)} ↗</button>`:'<span class="suave">Legado</span>'}</td>
      <td>${fmtData(o.inicio)}</td><td>${fmtData(o.prazo)}</td>
      <td><b>${Math.min(100,Math.max(0,Number(o.progresso)||0))}%</b><div class="ob-progresso"><div style="width:${Math.min(100,Math.max(0,Number(o.progresso)||0))}%"></div></div></td>
      <td>${statusChip(o.status)}<span class="ob-status ${atrasada?'ob-atrasada':''}">${esc(statusPrazoObra(o))}</span></td>
      <td><button class="link" onclick="abrirObra('${esc(o.id)}')">Ver detalhes →</button></td></tr>`;
  }).join('')||'<tr><td colspan="9" class="sem-resultado">Nenhuma obra encontrada com esses filtros.</td></tr>';}
  function atualizarFiltrosObras(campo,valor){
    if(campo==='id')obrasFiltroId=valor;
    if(campo==='cliente')obrasFiltroCliente=valor;
    if(campo==='inicio')obrasFiltroInicio=valor;
    if(campo==='fim')obrasFiltroFim=valor;
    if(campo==='status')obrasFiltroStatus=valor;
    const lista=document.getElementById('obrasLinhas');if(lista)lista.innerHTML=obraTabelaLinhas();
    const n=document.getElementById('obrasContador');if(n)n.textContent=filtrarObras().length+' obra(s) encontrada(s)';
    const aviso=document.getElementById('obrasFiltroAviso');if(aviso)aviso.textContent=obrasFiltroInicio&&obrasFiltroFim&&obrasFiltroInicio>obrasFiltroFim?'A data inicial deve ser anterior ou igual à data final.':'';
  }
  function limparFiltrosObras(){obrasFiltroId='';obrasFiltroCliente='';obrasFiltroInicio='';obrasFiltroFim='';obrasFiltroStatus='Em andamento';render();}
  function abrirObra(id){const o=obras.find(x=>x.id===id);if(!o)return;obraAtual=o;formularioNovaObra=false;paginaAtual='obras';render();window.scrollTo(0,0);}
  function abrirNovaObra(){osParaNovaObraId=null;formularioNovaObra=true;obraAtual=null;paginaAtual='obras';render();}
  function fecharNovaObra(){formularioNovaObra=false;osParaNovaObraId=null;render();}
  function cadastrarObra(ev){
    ev.preventDefault();const f=new FormData(ev.target);
    const idOS=String(f.get('osId')||'');
    const os=ordensServico.find(x=>x.id===idOS);
    if(!os||os.legado||os.status!=='Aguardando planejamento'||obraDaOS(idOS)){
      alert('Selecione uma ordem de serviço válida, aprovada e sem execução vinculada.');return;
    }
    const inicio=String(f.get('inicio')||''),prazo=String(f.get('prazo')||'');
    if(!inicio||!prazo||prazo<inicio){alert('Informe datas válidas. O prazo não pode ser anterior ao início.');return;}
    const novo={id:'OBR-'+new Date().getFullYear()+'-'+Date.now().toString().slice(-7),
      clienteId:os.clienteId,orcamentoId:os.orcamentoId,osId:os.id,
      tipoExecucao:String(f.get('tipoExecucao')||'Obra'),servico:os.servico,inicio,prazo,
      progresso:0,status:'Em andamento',responsavel:String(f.get('responsavel')||'').trim(),
      endereco:String(f.get('endereco')||'').trim(),observacao:String(f.get('observacao')||'').trim()};
    if(obras.some(x=>x.id===novo.id))novo.id+='-'+(obras.length+1);
    obras.unshift(novo);
    os.obraId=novo.id;os.status='Em execução';
    salvarObras();salvarOS();
    formularioNovaObra=false;osParaNovaObraId=null;obraAtual=novo;
    obrasFiltroStatus='Em andamento';render();window.scrollTo(0,0);
  }

  function atualizarObra(id,campo,valor){
    const o=obras.find(x=>x.id===id);if(!o)return;
    if(campo==='status'&&!['Em andamento','Concluída','Planejada'].includes(valor))return;
    if(campo==='progresso'&&(!Number.isFinite(Number(valor))||Number(valor)<0||Number(valor)>100))return;
    o[campo]=campo==='progresso'?Number(valor):valor;
    if(campo==='status'&&valor==='Concluída')o.progresso=100;
    if(o.osId){const os=ordensServico.find(x=>x.id===o.osId);if(os){os.status=o.status==='Concluída'?'Concluída':o.status==='Em andamento'?'Em execução':'Aguardando planejamento';salvarOS();}}
    salvarObras();render();
  }
  function formularioCadastroObra(){
    const elegiveis=ordensServico.filter(o=>!o.legado&&o.status==='Aguardando planejamento'&&!obraDaOS(o.id));
    const selecionada=elegiveis.find(o=>o.id===osParaNovaObraId)||elegiveis[0];
    const c=clientes.find(x=>x.id===selecionada?.clienteId);
    return `${cabecalho('Iniciar obra ou serviço','A execução deve nascer de uma ordem de serviço aprovada','<button class="botao botao-outline" onclick="fecharNovaObra()">← Voltar</button>')}
      <section class="card card-pad">${titulo('Abertura de execução','▥')}
      ${!elegiveis.length?`<div class="nota">Não há ordens de serviço aguardando planejamento. Aprove um orçamento primeiro.</div><div style="margin-top:14px"><button class="botao" onclick="ir('orcamentos')">Ir para Orçamentos →</button></div>`:
      `<form onsubmit="cadastrarObra(event)"><div class="ob-form">
        <label style="grid-column:1/-1">Ordem de serviço *<select name="osId" required onchange="osParaNovaObraId=this.value;atualizarCamposObraOS(this.value)">${elegiveis.map(o=>`<option value="${esc(o.id)}" ${o.id===selecionada.id?'selected':''}>${esc(o.id)} — ${esc(clientes.find(c=>c.id===o.clienteId)?.nome||'Cliente')} — ${esc(o.servico)}</option>`).join('')}</select></label>
        <div class="os-origem"><small>Cliente vinculado</small><b id="osClienteSelecionado">${esc(c?.nome||'—')}</b></div><div class="os-origem"><small>Serviço contratado</small><b id="osServicoSelecionado">${esc(selecionada.servico)}</b></div>
        <label>Tipo de execução *<select name="tipoExecucao"><option>Obra</option><option>Serviço</option></select></label>
        <label>Data de início *<input name="inicio" type="date" class="campo-input" value="${somarDias(0)}" required></label>
        <label>Prazo de entrega *<input name="prazo" type="date" class="campo-input" value="${somarDias(20)}" required></label>
        <label>Responsável / equipe<input name="responsavel" class="campo-input" maxlength="100"></label>
        <label>Local da execução<input name="endereco" class="campo-input" maxlength="170"></label>
        <label style="grid-column:1/-1">Observações<input name="observacao" class="campo-input" maxlength="240"></label>
      </div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="botao botao-outline" type="button" onclick="fecharNovaObra()">Cancelar</button><button class="botao" type="submit">Criar e iniciar execução</button></div></form>`}
      </section><p class="notinha">Cadastro demonstrativo no navegador; na aplicação real, o backend deverá criar a obra e atualizar a OS na mesma transação.</p>`;
  }

  function fichaObra(){
    const o=obraAtual,c=clienteDaObra(o),atrasada=statusPrazoObra(o)==='Em atraso';
    const os=o.osId?ordensServico.find(x=>x.id===o.osId):null;

    return `<button class="link" onclick="obraAtual=null;render()">← Voltar à lista de obras</button><div style="height:13px"></div>

      <section class="card card-pad" style="margin-bottom:17px"><div class="cabecalho" style="margin-bottom:13px"><div><h2 style="font-size:21px">${esc(o.servico)}</h2><p class="suave">${esc(o.id)} • ${esc(o.endereco||'Local a confirmar')}</p></div>${statusChip(o.status)}</div>

        <div class="duas-colunas"><div>${info('Cliente',`<button class="link" onclick="abrirCliente('${esc(c?.id||'')}')">${esc(c?.nome||'Não cadastrado')} ↗</button>`)}${info('Orçamento de origem',referencia)}${info('Ordem de Serviço',os?`<button class="link" onclick="abrirOS('${esc(os.id)}')">${esc(os.id)} ↗</button>`:'Não vinculada (registro legado)')}${info('Tipo de execução',esc(o.tipoExecucao||'Obra'))}${info('Responsável',esc(o.responsavel||'Não definido'))}</div><div>${info('Andamento',esc(o.progresso)+'%')}${info('Endereço da obra',esc(o.endereco||'A confirmar'))}</div></div>
        <div class="progresso"><div style="width:${Math.min(100,Math.max(0,Number(o.progresso)||0))}%"></div></div>
        ${atrasada?'<div class="ob-aviso">Esta obra está em andamento e ultrapassou o prazo de entrega previsto.</div>':''}
      </section>
      <section class="card card-pad" style="margin-bottom:17px">${fluxoRelacionamento(orc,os,o)}</section>

        <label style="display:block;font-size:12px;font-weight:700;color:#52665a">Status<select onchange="atualizarObra('${esc(o.id)}','status',this.value)">${['Planejada','Em andamento','Concluída'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></label>
        <label style="display:block;font-size:12px;font-weight:700;color:#52665a;margin-top:16px">Progresso (%)<input class="campo-input" type="number" min="0" max="100" step="1" value="${Number(o.progresso)||0}" onchange="atualizarObra('${esc(o.id)}','progresso',this.value)"></label>
        <p class="notinha">A edição altera os indicadores de obras da Home e desta tela.</p></section>
        <section class="card card-pad">${titulo('Observações e arquivos','✎')}<p class="nota">${esc(o.observacao||'Nenhuma observação registrada.')}</p><div style="height:16px"></div><button class="botao botao-outline" onclick="abrirCliente('${esc(c?.id||'')}','documentos')">Ver documentos do cliente →</button></section></div>`;
  }
  function paginaObras(){
    if(formularioNovaObra)return formularioCadastroObra();
    if(obraAtual)return fichaObra();
    return `${cabecalho('Obras','Controle de execução e acompanhamento de prazos de todas as obras','<button class="botao" onclick="abrirNovaObra()">+ Nova obra</button>')}
      <div class="mini-indicadores">${kpi('Obras em andamento',obrasEmAndamento().length,'Total de obras ainda em execução')}${kpi('Dentro do prazo',abertasNoPrazo().length,'Em andamento com prazo ainda vigente')}${kpi('Obras em atraso',abertasEmAtraso().length,'Em andamento com prazo ultrapassado')}</div>
      <section class="card card-pad">${titulo('Pesquisar obras','⌕')}

  }

      const c=clientes.find(x=>x.id===o.clienteId);
      return (textoNormalizado(o.id).includes(termo)||textoNormalizado(o.orcamentoId).includes(termo))
        &&textoNormalizado(c?.nome||'').includes(clienteNome);
    }).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  }
  function atualizarListaOrdens(){
    const linhas=document.getElementById('linhasOS');if(linhas)linhas.innerHTML=linhasOrdensServico();
    const contador=document.getElementById('contadorOS');if(contador)contador.textContent=listaOrdens().length+' registro(s)';
  }
  function linhasOrdensServico(){
    return listaOrdens().map(o=>{
      const c=clientes.find(x=>x.id===o.clienteId),obra=obraDaOS(o.id);
      return `<tr><td><button class="link" onclick="abrirOS('${esc(o.id)}')">${esc(o.id)} ↗</button>${o.legado?'<small class="suave" style="display:block">Legado</small>':''}</td><td><button class="link" onclick="abrirCliente('${esc(o.clienteId)}','pedidos')">${esc(c?.nome||'Não cadastrado')} ↗</button></td><td>${o.orcamentoId?`<button class="link" onclick="abrirOrcamento('${esc(o.orcamentoId)}','ordens')">${esc(o.orcamentoId)} ↗</button>`:'—'}</td><td>${esc(o.servico)}</td><td>${brl(o.valor)}</td><td>${statusChip(o.status)}</td><td>${obra?`<button class="link" onclick="abrirObra('${esc(obra.id)}')">${esc(obra.id)} ↗</button>`:'—'}</td></tr>`;
    }).join('')||'<tr><td colspan="7" class="sem-resultado">Nenhuma OS encontrada.</td></tr>';
  }
  function paginaOrdens(){
    return `${cabecalho('Ordens de Serviço','Pedidos gerados de orçamentos aprovados e seus serviços em execução','<button class="botao botao-outline" onclick="ir(&#39;orcamentos&#39;)">Ver orçamentos →</button>')}
      <div class="mini-indicadores">${kpi('Ordens cadastradas',ordensServico.length,'Incluindo registros antigos')}${kpi('Aguardando planejamento',ordensServico.filter(o=>o.status==='Aguardando planejamento').length,'Prontas para iniciar execução')}${kpi('Em execução',ordensServico.filter(o=>o.status==='Em execução').length,'Vinculadas a serviços ou obras')}</div>
      <section class="card card-pad">${titulo('Consultar ordens de serviço','⌕')}<div class="os-filtros"><label>Código da OS ou orçamento<input class="campo-input" value="${esc(filtroOS)}" placeholder="Ex.: OS-2026-0001" oninput="filtroOS=this.value;atualizarListaOrdens()"></label><label>Nome do cliente<input class="campo-input" value="${esc(filtroOSCliente)}" placeholder="Ex.: Maria Oliveira" oninput="filtroOSCliente=this.value;atualizarListaOrdens()"></label></div>
      <p class="suave" id="contadorOS" style="font-size:12px;margin-bottom:10px">${listaOrdens().length} registro(s)</p>
      <div class="tabela-wrap"><table><thead><tr><th>Pedido / OS</th><th>Cliente</th><th>Orçamento de origem</th><th>Serviço</th><th>Valor</th><th>Situação</th><th>Obra / Serviço</th></tr></thead><tbody id="linhasOS">${linhasOrdensServico()}</tbody></table></div></section><p class="notinha">Pedidos legados não têm orçamento de origem confirmado e não recebem vínculos fictícios.</p>`;
  }
  function fichaOS(){
    const os=ordensServico.find(x=>x.id===osAtual?.id);if(!os)return paginaOrdens();
    const c=clientes.find(x=>x.id===os.clienteId),orc=orcamentos.find(x=>x.id===os.orcamentoId),obra=obraDaOS(os.id);
    return `<button class="link" onclick="osAtual=null;render()">← Voltar para Ordens de Serviço</button><div style="height:13px"></div>
      ${cabecalho('Ficha da Ordem de Serviço','Pedido '+esc(os.id),statusChip(os.status))}
      <section class="card card-pad" style="margin-bottom:18px"><div class="cabecalho"><div><p class="suave">ORDEM DE SERVIÇO</p><h2 style="font-size:23px">${esc(os.id)}</h2><p class="suave">Criada em ${fmtData(os.data)}</p></div>${statusChip(os.status)}</div>
      ${fluxoRelacionamento(orc,os,obra)}
      <div class="duas-colunas" style="margin-top:18px"><div>${info('Cliente',`<button class="link" onclick="abrirCliente('${esc(c?.id||'')}','pedidos')">${esc(c?.nome||'Não cadastrado')} ↗</button>`)}${info('Serviço contratado',esc(os.servico))}${info('Valor contratado',brl(os.valor))}</div><div>${info('Orçamento de origem',orc?`<button class="link" onclick="abrirOrcamento('${esc(orc.id)}','ordens')">${esc(orc.id)} ↗</button>`:'Não informado (pedido legado)')}${info('Execução vinculada',obra?`<button class="link" onclick="abrirObra('${esc(obra.id)}')">${esc(obra.id)} ↗</button>`:'Ainda não iniciada')}${info('Situação',statusChip(os.status))}</div></div>
      <div class="os-acoes">${!obra&&!os.legado&&os.status==='Aguardando planejamento'?`<button class="botao" onclick="prepararObraDaOS('${esc(os.id)}')">Iniciar obra ou serviço →</button>`:''}
        ${obra?`<button class="botao" onclick="abrirObra('${esc(obra.id)}')">Acompanhar execução →</button>`:''}
        ${os.legado?'<span class="suave">Registro anterior à integração: origem não confirmada.</span>':''}</div></section>
      <p class="notinha">A OS é gerada após a aprovação do orçamento. Iniciar a execução cria a ficha de obra/serviço vinculada a ela.</p>`;
  }
  function prepararObraDaOS(id){
    const os=ordensServico.find(x=>x.id===id);
    if(!os||os.legado||os.status!=='Aguardando planejamento'||obraDaOS(id)){
      alert('Esta ordem de serviço não está disponível para iniciar uma nova execução.');return;
    }
    osParaNovaObraId=os.id;formularioNovaObra=true;obraAtual=null;paginaAtual='obras';render();window.scrollTo(0,0);
  }
  function atualizarCamposObraOS(id){
    const os=ordensServico.find(o=>o.id===id);
    const c=clientes.find(x=>x.id===os?.clienteId);
    const cliente=document.getElementById('osClienteSelecionado');if(cliente)cliente.textContent=c?.nome||'—';
    const servico=document.getElementById('osServicoSelecionado');if(servico)servico.textContent=os?.servico||'—';
  }

  function render(){renderMenu();elPagina.innerHTML=paginaAtual==='inicio'?home():paginaAtual==='clientes'?(clienteAtual?fichaCliente():listarClientes()):paginaAtual==='agendamento'?agenda():paginaAtual==='followup'?followup():paginaAtual==='ordens'?(osAtual?fichaOS():paginaOrdens()):paginaAtual==='orcamentos'?(orcamentoAtual?fichaOrcamento():paginaOrcamentos()):paginaAtual==='fornecedores'?paginaFornecedores():paginaAtual==='contratos'?paginaContratos():paginaAtual==='obras'?paginaObras():outraPagina(); prepararAvisoManual();}
  orcamentos.filter(o=>o.status==='Aprovado').forEach(garantirOSDoOrcamento);
  render();
</script>
</body>
</html>
