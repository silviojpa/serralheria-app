version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: serralheria_db
    restart: always
    environment:
      POSTGRES_DB: serralheria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sua_senha_segura
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: ./web
    container_name: serralheria_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./web:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=serralheria_db
      - DB_USER=postgres
      - DB_PASSWORD=sua_senha_segura
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: