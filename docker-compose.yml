services:
  db:
    image: postgres:15-alpine
    container_name: serralheria_db
    restart: always
    env_file: .env   # <--- Lê as senhas do arquivo .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Testa se o banco já está pronto para receber conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    container_name: serralheria_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./web:/app
    ports:
      - "8000:8000"
    env_file: .env   # <--- A web também lê o arquivo .env
    environment:
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy # <--- Só inicia a web quando o banco estiver 100% pronto

volumes:
  postgres_data: